<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#081914">
<title>Стаканы</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M24 22h52l-8 62c-1 6-10 8-18 8s-17-2-18-8z' fill='%23E0A83C'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --felt-deep: #081914;
    --felt: #102C24;
    --felt-up: #17392E;
    --felt-edge: #1F4C3C;

    --brass: #E0A83C;
    --brass-soft: #F0C978;
    --brass-dim: #8C6A26;

    --bone: #F3EEE1;
    --muted: #86A296;
    --red: #C9573D;
    --green: #6FBF8B;

    --line: rgba(224, 168, 60, 0.16);
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);

    --display: "Unbounded", "Golos Text", system-ui, sans-serif;
    --text: "Golos Text", -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
    margin: 0;
    font-family: var(--text);
    color: var(--bone);
    background:
        radial-gradient(120% 90% at 50% -10%, #1B4335 0%, var(--felt) 45%, var(--felt-deep) 100%),
        var(--felt-deep);
    background-attachment: fixed;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }

.masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 16px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
}

.wordmark {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(20px, 5vw, 30px);
    letter-spacing: 0.14em;
    margin: 0;
}

.room-tag { font-size: 13px; color: var(--muted); white-space: nowrap; }

button.tiny {
    font-size: 12px;
    font-weight: 400;
    padding: 3px 10px;
    margin-left: 8px;
    border-radius: 8px;
}

.room-tag b {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: 0.22em;
    color: var(--brass);
}

.card {
    background: linear-gradient(180deg, var(--felt-up), var(--felt));
    border: 1px solid var(--felt-edge);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
}

.card h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.06em;
    margin: 0 0 14px;
}

.section-label { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.rule { height: 1px; background: var(--line); margin: 20px 0; border: 0; }
.hidden { display: none !important; }

button {
    font-family: var(--text);
    font-size: 15px;
    font-weight: 600;
    border: 1px solid var(--brass-dim);
    border-radius: 10px;
    padding: 11px 18px;
    background: linear-gradient(180deg, var(--brass-soft), var(--brass));
    color: #2A1D06;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
}

button:hover:not(:disabled) { filter: brightness(1.07); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: 0.35; cursor: not-allowed; }

button.ghost { background: transparent; color: var(--bone); border-color: var(--felt-edge); }
button.ghost:hover:not(:disabled) { border-color: var(--brass-dim); filter: none; }

:focus-visible { outline: 2px solid var(--brass-soft); outline-offset: 2px; }

label { font-size: 14px; color: var(--muted); }

input {
    font-family: var(--text);
    font-size: 16px;
    color: var(--bone);
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid var(--felt-edge);
    border-radius: 10px;
    padding: 10px 12px;
    width: 100%;
}

input:focus { border-color: var(--brass-dim); outline: none; }

.field { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }

/* ---------- вход ---------- */

.entry { max-width: 440px; margin: 4vh auto 0; }
.entry .lede { text-align: center; color: var(--muted); margin: 0 0 22px; }

.code-field input {
    font-family: var(--display);
    font-weight: 600;
    font-size: 23px;
    letter-spacing: 0.3em;
    text-align: center;
    text-transform: uppercase;
}

/* ---------- стол ---------- */

.arena {
    position: relative;
    width: 100%;
    aspect-ratio: 10 / 7;
    min-height: 420px;
    max-height: 620px;
    margin-bottom: 18px;
}

.felt {
    position: absolute;
    left: 11%;
    right: 11%;
    top: 13%;
    bottom: 13%;
    border-radius: 46% / 50%;
    background:
        radial-gradient(70% 90% at 50% 12%, rgba(255, 255, 255, 0.07), transparent 62%),
        linear-gradient(180deg, #1B4235, #0E2A22);
    border: 2px solid var(--felt-edge);
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.55), var(--shadow);
}

.felt::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 46% / 50%;
    border: 1px solid rgba(224, 168, 60, 0.14);
}

.center {
    position: absolute;
    left: 18%;
    right: 18%;
    top: 27%;
    bottom: 20%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.announce {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(13px, 2.4vw, 17px);
    text-align: center;
}

.announce.you { color: var(--brass); }

.note { font-size: 13px; color: var(--muted); text-align: center; min-height: 18px; }

.clock { width: 120px; height: 3px; background: rgba(0, 0, 0, 0.4); border-radius: 2px; overflow: hidden; }
.clock i { display: block; height: 100%; background: var(--brass); width: 100%; }
.clock.low i { background: var(--red); }

.cups {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
}

.cup {
    position: relative;
    border: 0;
    background: none;
    padding: 2px;
    cursor: default;
    width: 74px;
}

.cup-stage { position: relative; height: 86px; }

.vessel {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: transform 0.25s ease;
}

.vessel svg { width: 52px; height: 72px; display: block; }

.cup.live { cursor: pointer; }
.cup.live:hover .vessel, .cup.live:focus-visible .vessel { transform: translateY(-8px); }
.cup.picked .vessel { transform: translateY(-8px); }
.cup.picked .cup-caption { color: var(--brass); }

.cup.opened .vessel { transform: translate(12px, -34px) rotate(14deg); }
.cup.opened.just .vessel { animation: lift 0.55s ease both; }

@keyframes lift {
    0% { transform: translate(0, 0) rotate(0deg); }
    45% { transform: translate(3px, -46px) rotate(7deg); }
    100% { transform: translate(12px, -34px) rotate(14deg); }
}

.pile {
    position: absolute;
    left: 0; right: 0; bottom: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
}

.pile svg { width: 44px; height: 22px; }
.cup.opened .pile { opacity: 1; }
.cup.opened.just .pile { animation: appear 0.4s 0.28s ease both; }

@keyframes appear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: none; }
}

.pile-amount {
    font-family: var(--display);
    font-weight: 600;
    font-size: 16px;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
}

.cup-caption { font-size: 11px; color: var(--muted); min-height: 15px; }

.cup-bets { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }

.bet-chip {
    font-size: 10px;
    color: #2A1D06;
    background: var(--brass-soft);
    border-radius: 5px;
    padding: 1px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ---------- места ---------- */

.seat {
    position: absolute;
    width: 108px;
    margin-left: -54px;
    margin-top: -34px;
    text-align: center;
    background: rgba(6, 20, 16, 0.88);
    border: 1px solid var(--felt-edge);
    border-radius: 12px;
    padding: 7px 6px;
}

.seat.dealer { border-color: var(--brass-dim); }
.seat.me { box-shadow: 0 0 0 1px var(--brass-dim); }
.seat.offline { opacity: 0.45; }
.seat.active { border-color: var(--brass); background: rgba(45, 34, 10, 0.92); }

.seat-name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.seat-chips {
    font-family: var(--display);
    font-weight: 600;
    font-size: 19px;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
}

.seat-chips.fuzzy { color: var(--muted); }

.seat-sub { font-size: 10px; color: var(--muted); }

.seat-delta { font-size: 11px; font-weight: 600; }
.seat-delta.up { color: var(--green); }
.seat-delta.down { color: var(--red); }

.disc {
    position: absolute;
    top: -8px;
    right: -6px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--bone);
    color: #14251E;
    font-family: var(--display);
    font-weight: 800;
    font-size: 10px;
    line-height: 22px;
}

.seat-react {
    position: absolute;
    left: 50%;
    top: -14px;
    transform: translateX(-50%);
    font-size: 24px;
    pointer-events: none;
    animation: pop 2.4s ease forwards;
}

@keyframes pop {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(0.6); }
    15% { opacity: 1; transform: translate(-50%, -10px) scale(1); }
    75% { opacity: 1; transform: translate(-50%, -22px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(0.9); }
}

.flier {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    color: var(--brass);
    transition: transform 0.75s cubic-bezier(0.4, 0.1, 0.3, 1), opacity 0.75s;
}

.flier svg { width: 26px; height: 14px; }

@media (prefers-reduced-motion: reduce) {
    .vessel, .pile, .flier, .seat-react { transition: none; animation: none !important; }
}

@media (max-width: 620px) {
    .arena { aspect-ratio: 4 / 5; min-height: 500px; }
    .felt { left: 4%; right: 4%; top: 9%; bottom: 9%; border-radius: 40% / 46%; }
    .center { left: 12%; right: 12%; top: 30%; bottom: 26%; }
    .seat { width: 84px; margin-left: -42px; padding: 5px 4px; }
    .seat-chips { font-size: 16px; }
    .cup { width: 60px; }
    .cup-stage { height: 72px; }
    .vessel svg { width: 44px; height: 60px; }
}

/* ---------- панель действий ---------- */

.console { min-height: 60px; }

.console .row { justify-content: center; }

.dist {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
}

.dist-cup {
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--felt-edge);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
}

.dist-cup svg { width: 28px; height: 38px; opacity: 0.75; }

.dist-cup input {
    text-align: center;
    font-family: var(--display);
    font-weight: 600;
    font-size: 17px;
    padding: 7px 4px;
    margin-top: 4px;
}

.dist-cup span { font-size: 11px; color: var(--muted); }

.tally { text-align: center; font-size: 14px; margin-bottom: 14px; }

.tally b {
    font-family: var(--display);
    font-weight: 600;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
}

.tally.bad b { color: var(--red); }

.reactions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

.reactions button {
    background: transparent;
    border-color: var(--felt-edge);
    font-size: 20px;
    padding: 6px 10px;
    line-height: 1;
}

/* ---------- итоги ---------- */

.standings { display: flex; flex-direction: column; gap: 8px; }

.standing {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--felt-edge);
    border-radius: 12px;
}

.standing .place {
    font-family: var(--display);
    font-weight: 800;
    font-size: 18px;
    color: var(--brass);
    width: 26px;
}

.standing.first { border-color: var(--brass); }
.standing.bust .place { color: var(--red); }
.standing .grow { flex: 1; }

.standing .sum {
    font-family: var(--display);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.results { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }

.result-chip {
    font-size: 13px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--felt-edge);
    border-radius: 999px;
    padding: 6px 12px;
}

.result-chip b { font-variant-numeric: tabular-nums; }
.result-chip b.up { color: var(--green); }
.result-chip b.down { color: var(--red); }

/* ---------- служебное ---------- */

.toast {
    position: fixed;
    left: 50%; top: 16px;
    transform: translateX(-50%);
    background: #24140F;
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 14px;
    max-width: 90vw;
    z-index: 30;
    box-shadow: var(--shadow);
}

.toast.info { border-color: var(--brass-dim); background: #1C2A1B; }

.status {
    position: fixed;
    left: 12px; bottom: 12px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(8, 25, 20, 0.9);
    border: 1px solid var(--felt-edge);
    border-radius: 999px;
    padding: 4px 12px;
}

.status.down { color: var(--red); border-color: var(--red); }

.version {
    position: fixed;
    right: 12px; bottom: 12px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
}

.watchers { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>

<body>

<div class="wrap">

    <header class="masthead">
        <h1 class="wordmark">СТАКАНЫ</h1>
        <div class="room-tag hidden" id="roomTag">
            комната <b id="roomTagCode"></b>
            <button class="ghost tiny" id="leaveButton" onclick="leaveRoom()">выйти</button>
        </div>
    </header>

    <section class="entry" id="entryScreen">

        <p class="lede">Дилер прячет фишки под стаканы, остальные торгуются за очередь и вскрывают. От 2 до 8 человек.</p>

        <div class="card">
            <div class="field">
                <label for="nameInput">Как тебя зовут</label>
                <input id="nameInput" maxlength="20" placeholder="Имя" autocomplete="nickname">
            </div>

            <hr class="rule">

            <button style="width:100%" onclick="createRoom()">Создать комнату</button>

            <hr class="rule">

            <div class="field code-field">
                <label for="codeInput">Или войти по коду</label>
                <input id="codeInput" maxlength="4" placeholder="····" autocomplete="off">
            </div>

            <div class="row" style="margin-top:12px">
                <button class="ghost" style="flex:1" onclick="joinRoom(false)">Играть</button>
                <button class="ghost" style="flex:1" onclick="joinRoom(true)">Смотреть</button>
            </div>
        </div>

    </section>

    <section class="hidden" id="lobbyScreen">

        <div class="card">
            <h2>Кто в комнате</h2>
            <div id="lobbyList"></div>

            <hr class="rule">

            <p class="section-label" id="lobbyStatus"></p>

            <div class="row" id="hostControls">
                <div class="field" style="flex:0 1 190px">
                    <label for="startingChips">Фишек на старте</label>
                    <input id="startingChips" type="number" inputmode="numeric" value="100" min="10">
                </div>
                <button id="startButton" onclick="startGame()">Начать игру</button>
            </div>
        </div>

        <div class="card">
            <h2>Позвать игроков</h2>
            <p class="section-label">Отправь ссылку или продиктуй код комнаты.</p>
            <button class="ghost" onclick="copyLink()">Скопировать ссылку</button>
        </div>

    </section>

    <section class="hidden" id="gameScreen">

        <div class="arena" id="arena">
            <div class="felt"></div>
            <div class="center">
                <div class="announce" id="announce"></div>
                <div class="note" id="note"></div>
                <div class="clock hidden" id="clock"><i id="clockBar"></i></div>
                <div class="cups" id="cups"></div>
            </div>
        </div>

        <div class="card console" id="console"></div>

        <div class="reactions" id="reactions"></div>
        <div class="watchers" id="watchers"></div>

    </section>

</div>

<div class="status" id="status">Подключение…</div>
<div class="version" id="version"></div>

<template id="cupShape">
    <svg viewBox="0 0 80 108" aria-hidden="true">
        <defs>
            <linearGradient id="cupBody" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#2A5546"/>
                <stop offset="0.35" stop-color="#3C7360"/>
                <stop offset="0.72" stop-color="#24493C"/>
                <stop offset="1" stop-color="#1B3A2F"/>
            </linearGradient>
            <linearGradient id="cupRim" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#8C6A26"/>
                <stop offset="0.4" stop-color="#E0A83C"/>
                <stop offset="1" stop-color="#8C6A26"/>
            </linearGradient>
        </defs>
        <path d="M9 14 L18 92 C19 100 30 104 40 104 C50 104 61 100 62 92 L71 14 Z" fill="url(#cupBody)"/>
        <path d="M22 20 L29 90 C29.5 94 32 96 35 97 L27 20 Z" fill="#ffffff" opacity="0.09"/>
        <ellipse cx="40" cy="14" rx="31" ry="9" fill="url(#cupRim)"/>
        <ellipse cx="40" cy="14" rx="25" ry="6" fill="#14322A"/>
    </svg>
</template>

<template id="cupMini">
    <svg viewBox="0 0 80 108" aria-hidden="true">
        <path d="M9 14 L18 92 C19 100 30 104 40 104 C50 104 61 100 62 92 L71 14 Z" fill="#24493C"/>
        <ellipse cx="40" cy="14" rx="31" ry="9" fill="#8C6A26"/>
        <ellipse cx="40" cy="14" rx="25" ry="6" fill="#14322A"/>
    </svg>
</template>

<template id="chipStack">
    <svg viewBox="0 0 70 34" aria-hidden="true">
        <ellipse cx="35" cy="26" rx="21" ry="7" fill="#8C6A26"/>
        <ellipse cx="35" cy="23" rx="21" ry="7" fill="#E0A83C"/>
        <ellipse cx="35" cy="20" rx="21" ry="7" fill="#C08F2E"/>
        <ellipse cx="35" cy="17" rx="21" ry="7" fill="#F0C978"/>
        <ellipse cx="35" cy="17" rx="12" ry="4" fill="#C08F2E" opacity="0.55"/>
    </svg>
</template>

<script>

const EMOJI = ["😂", "😱", "🔥", "🤔", "😈", "🫡"];

let ws = null;
let state = null;
let myId = localStorage.getItem("cupsPlayerId");
let myName = localStorage.getItem("cupsPlayerName") || "";
let roomCode = null;
let pending = null;
let watchMode = false;
let left = false;

let builtRound = -1;
let seenOpened = new Set();
let seenRound = -1;
let pickedCup = null;
let clockTimer = null;
let reconnectDelay = 1000;

if (!myId) {
    myId = Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("cupsPlayerId", myId);
}

document.getElementById("nameInput").value = myName;

const urlCode = new URLSearchParams(location.search).get("room");
if (urlCode) document.getElementById("codeInput").value = urlCode.toUpperCase();

const savedRoom = sessionStorage.getItem("cupsRoom");

buildReactions();
connect();

function connect() {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host);

    ws.onopen = () => {
        reconnectDelay = 1000;
        setStatus("На связи", false);

        const code = left ? null : (roomCode || savedRoom);

        if (code && myName) {
            send({ t: "join", code, name: myName, playerId: myId, watch: watchMode });
        }

        if (pending) { send(pending); pending = null; }
    };

    ws.onclose = () => {
        setStatus("Связь потеряна, переподключаемся…", true);
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
    };

    ws.onmessage = e => {
        const msg = JSON.parse(e.data);

        if (msg.t === "joined") {
            roomCode = msg.code;
            sessionStorage.setItem("cupsRoom", msg.code);
            history.replaceState(null, "", "?room=" + msg.code);
            return;
        }

        if (msg.t === "error") { toast(msg.msg); return; }

        if (msg.t === "fx") { playFx(msg.fx); return; }

        if (msg.t === "left") { resetToEntry(); return; }

        if (msg.t === "state") {
            if (left) return;

            state = msg;
            roomCode = msg.code;
            render();
            playFx(msg.fx);
        }
    };
}

function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
    else pending = obj;
}

function setStatus(text, down) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = "status" + (down ? " down" : "");
}

let toastNode = null, toastTimer = null;

function toast(text, kind) {
    if (toastNode) toastNode.remove();

    toastNode = document.createElement("div");
    toastNode.className = "toast" + (kind === "info" ? " info" : "");
    toastNode.textContent = text;
    document.body.appendChild(toastNode);

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        if (toastNode) toastNode.remove();
        toastNode = null;
    }, 4500);
}

/* ---------- вход ---------- */

function readName() {
    const name = document.getElementById("nameInput").value.trim();

    if (!name) { toast("Введи имя, чтобы тебя было видно за столом"); return null; }

    myName = name;
    localStorage.setItem("cupsPlayerName", name);
    return name;
}

function createRoom() {
    const name = readName();
    if (!name) return;
    left = false;
    watchMode = false;
    send({ t: "create", name, playerId: myId });
}

function joinRoom(watch) {
    const name = readName();
    if (!name) return;

    const code = document.getElementById("codeInput").value.trim().toUpperCase();
    if (code.length !== 4) { toast("Код комнаты состоит из 4 символов"); return; }

    left = false;
    watchMode = !!watch;
    send({ t: "join", code, name, playerId: myId, watch: watchMode });
}

function copyLink() {
    const link = location.origin + "/?room=" + roomCode;
    navigator.clipboard.writeText(link)
        .then(() => toast("Ссылка скопирована", "info"))
        .catch(() => toast(link, "info"));
}

document.getElementById("codeInput").addEventListener("keydown", e => {
    if (e.key === "Enter") joinRoom(false);
});

/* ---------- действия ---------- */

function startGame() {
    send({ t: "start", startingChips: Number(document.getElementById("startingChips").value) });
}

function submitDistribution() {
    const values = [];
    for (let i = 0; i < state.players.length; i++) {
        values.push(Number(document.getElementById("dist-" + i).value) || 0);
    }
    send({ t: "distribute", values });
}

function sendBid(pass) {
    if (pass) return send({ t: "bid", pass: true });
    send({ t: "bid", amount: Number(document.getElementById("bidInput").value) });
}

function sendBet(skip) {
    if (skip) return send({ t: "bet", skip: true });

    if (pickedCup === null) { toast("Выбери стакан на столе"); return; }

    send({ t: "bet", cup: pickedCup, amount: Number(document.getElementById("betInput").value) });
    pickedCup = null;
}

function pickCup(index) {
    if (state.phase === "choosing") return send({ t: "open", cup: index });

    if (state.phase === "betting" && state.betting.currentId === myId) {
        pickedCup = index;
        render();
    }
}

function leaveRoom() {
    const playing = state && state.phase !== "lobby" && state.phase !== "over" && !state.spectator;

    if (playing && !confirm("Выйти из партии? Твои фишки разойдутся между остальными.")) {
        return;
    }

    left = true;
    send({ t: "leave" });
    resetToEntry();
}

function resetToEntry() {
    left = true;
    state = null;
    roomCode = null;
    pickedCup = null;
    builtRound = -1;
    clearInterval(clockTimer);

    sessionStorage.removeItem("cupsRoom");
    history.replaceState(null, "", location.pathname);

    show("entryScreen", true);
    show("lobbyScreen", false);
    show("gameScreen", false);
    show("roomTag", false);
}

function nextRound() { send({ t: "next" }); }
function restart() { send({ t: "restart" }); }
function react(emoji) { send({ t: "react", emoji }); }

function buildReactions() {
    const box = document.getElementById("reactions");
    EMOJI.forEach(e => {
        const b = document.createElement("button");
        b.textContent = e;
        b.setAttribute("aria-label", "реакция " + e);
        b.onclick = () => react(e);
        box.appendChild(b);
    });
}

/* ---------- отрисовка ---------- */

function me() { return state.players.find(p => p.id === myId); }
function amHost() { return state.hostId === myId; }
function amDealer() { return state.dealerId === myId; }
function myMove() { return state.activeId === myId; }

function render() {
    document.getElementById("version").textContent = "v" + state.version;
    document.getElementById("roomTagCode").textContent = state.code;
    show("roomTag", true);

    const inLobby = state.phase === "lobby";

    show("entryScreen", false);
    show("lobbyScreen", inLobby);
    show("gameScreen", !inLobby);

    if (inLobby) { renderLobby(); builtRound = -1; return; }

    if (seenRound !== state.roundId) {
        seenRound = state.roundId;
        seenOpened = new Set();
        pickedCup = null;
    }

    renderSeats();
    renderCups();
    renderCenter();
    renderConsole();
    renderWatchers();
}

function show(id, visible) {
    document.getElementById(id).classList.toggle("hidden", !visible);
}

function art(id) { return document.getElementById(id).content.cloneNode(true); }

function renderLobby() {
    const list = document.getElementById("lobbyList");
    list.innerHTML = "";

    state.players.forEach(p => {
        const div = document.createElement("div");
        div.className = "result-chip";
        div.style.marginRight = "8px";
        div.textContent = p.name + (p.id === state.hostId ? " · создатель" : "");
        list.appendChild(div);
    });

    const n = state.players.length;

    show("hostControls", amHost());

    document.getElementById("lobbyStatus").textContent = amHost()
        ? (n < 2 ? "Собрался " + n + ". Нужно хотя бы двое." : "За столом " + n + ". Можно начинать.")
        : "Игру запускает создатель комнаты. Сейчас за столом " + n + ".";

    if (amHost()) document.getElementById("startButton").disabled = n < 2;
}

function renderSeats() {
    const arena = document.getElementById("arena");

    arena.querySelectorAll(".seat").forEach(s => s.remove());

    const n = state.players.length;
    const myIndex = state.players.findIndex(p => p.id === myId);
    const anchor = myIndex >= 0 ? myIndex : 0;
    const narrow = window.innerWidth <= 620;

    const rx = narrow ? 40 : 45;
    const ry = narrow ? 43 : 40;

    state.players.forEach((p, i) => {
        const step = ((i - anchor) + n) % n;
        const angle = (90 + step * (360 / n)) * Math.PI / 180;

        const div = document.createElement("div");

        div.className = "seat"
            + (p.isDealer ? " dealer" : "")
            + (p.id === myId ? " me" : "")
            + (p.connected ? "" : " offline")
            + (p.id === state.activeId ? " active" : "");

        div.id = "seat-" + p.id;
        div.style.left = (50 + rx * Math.cos(angle)) + "%";
        div.style.top = (50 + ry * Math.sin(angle)) + "%";

        const sub = !p.connected ? "ждём возвращения"
            : p.id === state.activeId ? "ходит"
            : p.isDealer ? "дилер"
            : "фишек";

        const delta = p.delta === null || p.delta === undefined || p.delta === 0
            ? ""
            : '<div class="seat-delta ' + (p.delta > 0 ? "up" : "down") + '">'
                + (p.delta > 0 ? "+" : "") + p.delta + "</div>";

        div.innerHTML =
            (p.isDealer ? '<div class="disc">D</div>' : "") +
            '<div class="seat-name">' + esc(p.name) + (p.id === myId ? " · ты" : "") + "</div>" +
            '<div class="seat-chips' + (p.exact ? "" : " fuzzy") + '">' + p.chips + "</div>" +
            delta +
            '<div class="seat-sub">' + sub + "</div>";

        arena.appendChild(div);
    });
}

function renderCups() {
    const box = document.getElementById("cups");
    box.innerHTML = "";

    const canOpen = state.phase === "choosing" && myMove();
    const canBet = state.phase === "betting" && myMove();
    const left = state.cups.filter(c => !c.opened).length;

    const cups = state.cups.length
        ? state.cups
        : state.players.map((p, i) => ({ number: i + 1, opened: false, chips: null, bets: [] }));

    cups.forEach((cup, index) => {
        const fresh = cup.opened && !seenOpened.has(cup.number);
        const live = !cup.opened && ((canOpen && left > 1) || canBet);

        const button = document.createElement("button");

        button.className = "cup"
            + (cup.opened ? " opened" : "")
            + (fresh ? " just" : "")
            + (live ? " live" : "")
            + (pickedCup === index ? " picked" : "");

        button.id = "cup-" + cup.number;
        button.disabled = !live;

        const stage = document.createElement("div");
        stage.className = "cup-stage";

        const pile = document.createElement("div");
        pile.className = "pile";

        if (cup.opened) {
            if (cup.chips > 0) pile.appendChild(art("chipStack"));

            const amount = document.createElement("div");
            amount.className = "pile-amount";
            amount.textContent = cup.chips;
            pile.appendChild(amount);
        }

        const vessel = document.createElement("div");
        vessel.className = "vessel";
        vessel.appendChild(art("cupShape"));

        stage.appendChild(pile);
        stage.appendChild(vessel);

        const caption = document.createElement("div");
        caption.className = "cup-caption";
        caption.textContent = cup.opened ? (cup.openedBy || "") : "№" + cup.number;

        button.appendChild(stage);
        button.appendChild(caption);

        if (cup.bets.length) {
            const bets = document.createElement("div");
            bets.className = "cup-bets";

            cup.bets.forEach(b => {
                const chip = document.createElement("div");
                chip.className = "bet-chip";
                chip.textContent = b.name + " " + b.amount;
                bets.appendChild(chip);
            });

            button.appendChild(bets);
        }

        if (live) button.onclick = () => pickCup(index);

        box.appendChild(button);

        if (cup.opened) seenOpened.add(cup.number);
    });
}

function renderCenter() {
    const announce = document.getElementById("announce");
    announce.textContent = state.message || "";
    announce.classList.toggle("you", myMove());

    document.getElementById("note").textContent = state.note || "";

    startClock(state.deadlineIn, state.turnSeq);
}

let clockSeq = -1;
let clockEnd = 0;
let clockTotal = 0;

function startClock(ms, seq) {
    const clock = document.getElementById("clock");
    const bar = document.getElementById("clockBar");

    if (!ms) {
        clearInterval(clockTimer);
        clockSeq = -1;
        clock.classList.add("hidden");
        return;
    }

    clock.classList.remove("hidden");

    if (seq === clockSeq) return;

    clearInterval(clockTimer);

    clockSeq = seq;
    clockEnd = Date.now() + ms;
    clockTotal = ms;

    const end = clockEnd;
    const total = clockTotal;

    const tick = () => {
        const left = Math.max(0, end - Date.now());
        bar.style.width = (left / total * 100) + "%";
        clock.classList.toggle("low", left < 10000);

        if (left <= 0) clearInterval(clockTimer);
    };

    tick();
    clockTimer = setInterval(tick, 200);
}

function renderWatchers() {
    const box = document.getElementById("watchers");

    box.textContent = state.spectators.length
        ? "Смотрят: " + state.spectators.map(s => s.name).join(", ")
        : "";
}

/* ---------- панель действий ---------- */

function renderConsole() {
    const box = document.getElementById("console");

    if (state.spectator) {
        box.innerHTML = '<p class="section-label" style="text-align:center;margin:0">'
            + "Ты наблюдаешь за игрой. Сядешь за стол в следующей партии.</p>";
        builtRound = -1;
        return;
    }

    if (state.phase === "over") return renderOver(box);
    if (state.phase === "roundEnd") return renderRoundEnd(box);
    if (state.phase === "distribution") return renderDistribution(box);
    if (state.phase === "auction") return renderAuction(box);
    if (state.phase === "betting") return renderBetting(box);

    box.innerHTML = '<p class="section-label" style="text-align:center;margin:0">'
        + (myMove() ? "Твой ход — вскрой стакан на столе" : esc(state.message)) + "</p>";
    builtRound = -1;
}

function renderDistribution(box) {
    if (!amDealer()) {
        box.innerHTML = '<p class="section-label" style="text-align:center;margin:0">'
            + "Дилер раскладывает фишки. Минимум по правилам — " + state.dealerMin + ".</p>";
        builtRound = -1;
        return;
    }

    if (builtRound !== state.roundId || !document.getElementById("dist-0")) {
        box.innerHTML = "";

        const head = document.createElement("p");
        head.className = "section-label";
        head.style.textAlign = "center";

        const need = Math.min(state.dealerMin, me().chips);

        head.textContent = "Разложи минимум " + need
            + " (10% от самого большого стека). Ставка игроков от " + state.betMin + ".";

        const grid = document.createElement("div");
        grid.className = "dist";

        for (let i = 0; i < state.players.length; i++) {
            const cell = document.createElement("div");
            cell.className = "dist-cup";
            cell.appendChild(art("cupMini"));

            const input = document.createElement("input");
            input.type = "number";
            input.inputMode = "numeric";
            input.min = "0";
            input.value = "0";
            input.id = "dist-" + i;
            input.addEventListener("input", updateTally);

            const label = document.createElement("span");
            label.textContent = "№" + (i + 1);

            cell.appendChild(input);
            cell.appendChild(label);
            grid.appendChild(cell);
        }

        const tally = document.createElement("div");
        tally.className = "tally";
        tally.id = "tally";

        const actions = document.createElement("div");
        actions.className = "row";

        actions.innerHTML =
            '<button id="dealButton">Выставить стаканы</button>'
            + '<button class="ghost" id="randomButton">Случайно</button>';

        box.appendChild(head);
        box.appendChild(grid);
        box.appendChild(tally);
        box.appendChild(actions);

        document.getElementById("dealButton").onclick = submitDistribution;
        document.getElementById("randomButton").onclick = randomDistribution;

        builtRound = state.roundId;
    }

    updateTally();
}

function distributionTotal() {
    let total = 0;

    for (let i = 0; i < state.players.length; i++) {
        const input = document.getElementById("dist-" + i);
        if (!input) continue;

        let v = Math.floor(Number(input.value));
        if (!(v > 0)) v = 0;

        total += v;
    }

    return total;
}

function updateTally() {
    const tally = document.getElementById("tally");
    if (!tally) return;

    const total = distributionTotal();
    const bank = me().chips;
    const need = Math.min(state.dealerMin, bank);

    const bad = total > bank || total < need;

    tally.className = "tally" + (bad ? " bad" : "");

    tally.innerHTML = total > bank
        ? "Под стаканами <b>" + total + "</b> — больше банка в " + bank
        : total < need
            ? "Под стаканами <b>" + total + "</b> — мало, нужно от " + need
            : "Под стаканами <b>" + total + "</b> · на руках останется <b>" + (bank - total) + "</b>";

    document.getElementById("dealButton").disabled = bad;
}

function randomDistribution() {
    const need = Math.min(state.dealerMin, me().chips);
    let left = need;
    const values = [];

    for (let i = 0; i < state.players.length; i++) {
        if (i === state.players.length - 1) values.push(left);
        else {
            const v = Math.floor(Math.random() * (left + 1));
            values.push(v);
            left -= v;
        }
    }

    values.sort(() => Math.random() - 0.5);

    for (let i = 0; i < state.players.length; i++) {
        document.getElementById("dist-" + i).value = values[i];
    }

    updateTally();
}

function renderAuction(box) {
    builtRound = -1;

    const bids = state.auction.bids
        .map(b => b.name + ": " + (b.amount === null ? "пас" : b.amount))
        .join(" · ");

    if (state.auction.currentId !== myId) {
        box.innerHTML = '<p class="section-label" style="text-align:center;margin:0 0 8px">'
            + "Торги за право ходить первым. Победитель обязан поставить названную сумму на стакан.</p>"
            + (bids ? '<p class="section-label" style="text-align:center;margin:0">' + esc(bids) + "</p>" : "");
        return;
    }

    const floor = Math.min(state.betMin, me().chips);

    box.innerHTML =
        '<p class="section-label" style="text-align:center">Твоя ставка за первый ход — от '
        + floor + ". Поставишь её на стакан, если выиграешь торги.</p>"
        + (bids ? '<p class="section-label" style="text-align:center">' + esc(bids) + "</p>" : "")
        + '<div class="row">'
        + '<div class="field" style="flex:0 1 160px"><label for="bidInput">Ставка</label>'
        + '<input id="bidInput" type="number" inputmode="numeric" min="' + floor + '" value="' + floor + '"></div>'
        + '<button id="bidButton">Назвать</button>'
        + '<button class="ghost" id="passButton">Пас</button>'
        + "</div>";

    document.getElementById("bidButton").onclick = () => sendBid(false);
    document.getElementById("passButton").onclick = () => sendBid(true);
}

function renderBetting(box) {
    builtRound = -1;

    if (state.betting.currentId !== myId) {
        box.innerHTML = '<p class="section-label" style="text-align:center;margin:0">'
            + esc(state.note) + "</p>";
        return;
    }

    const mandatory = state.betting.mandatory;
    const floor = mandatory
        ? Math.min(state.betting.committed, me().chips)
        : Math.min(state.betMin, me().chips);

    box.innerHTML =
        '<p class="section-label" style="text-align:center">'
        + (pickedCup === null ? "Ткни в стакан на столе, потом назначь ставку." : "Стакан №" + (pickedCup + 1) + " выбран.")
        + " Минимум — " + floor + ". Угадаешь стакан пожирнее — вернёшь ставку и заберёшь столько же из него.</p>"
        + '<div class="row">'
        + '<div class="field" style="flex:0 1 160px"><label for="betInput">Ставка</label>'
        + '<input id="betInput" type="number" inputmode="numeric" min="' + floor + '" value="' + floor + '"></div>'
        + '<button id="betButton">Поставить</button>'
        + (mandatory ? "" : '<button class="ghost" id="skipButton">Пропустить</button>')
        + "</div>";

    document.getElementById("betButton").onclick = () => sendBet(false);

    if (!mandatory) document.getElementById("skipButton").onclick = () => sendBet(true);
}

function renderRoundEnd(box) {
    builtRound = -1;

    const chips = (state.results || []).map(r =>
        '<div class="result-chip">' + esc(r.name) + " <b class=\""
        + (r.delta > 0 ? "up" : r.delta < 0 ? "down" : "") + "\">"
        + (r.delta > 0 ? "+" : "") + r.delta + "</b></div>"
    ).join("");

    const canStart = amHost() || amDealer();

    box.innerHTML =
        '<div class="results">' + chips + "</div>"
        + '<div class="row">'
        + '<button id="nextButton"' + (canStart ? "" : " disabled") + ">Следующий раунд</button>"
        + "</div>";

    if (canStart) document.getElementById("nextButton").onclick = nextRound;
}

function renderOver(box) {
    builtRound = -1;

    const rows = (state.standings || []).map(s =>
        '<div class="standing' + (s.place === 1 ? " first" : "") + (s.bankrupt ? " bust" : "") + '">'
        + '<div class="place">' + s.place + "</div>"
        + '<div class="grow">' + esc(s.name) + (s.bankrupt ? " · банкрот" : "") + "</div>"
        + '<div class="sum">' + s.chips + "</div>"
        + "</div>"
    ).join("");

    box.innerHTML =
        '<h2>Итоги партии</h2>'
        + '<div class="standings">' + rows + "</div>"
        + '<div class="row" style="margin-top:16px">'
        + '<button id="restartButton"' + (amHost() ? "" : " disabled") + ">Собрать новую игру</button>"
        + "</div>";

    if (amHost()) document.getElementById("restartButton").onclick = restart;
}

/* ---------- анимации ---------- */

function playFx(list) {
    if (!list || !list.length) return;

    list.forEach(item => {
        if (item.kind === "react") return showReaction(item);
        if (item.kind === "chips") return flyChips(item);
    });
}

function showReaction(item) {
    const seat = document.getElementById("seat-" + item.playerId);
    if (!seat) return;

    const bubble = document.createElement("div");
    bubble.className = "seat-react";
    bubble.textContent = item.emoji;
    seat.appendChild(bubble);

    setTimeout(() => bubble.remove(), 2500);
}

function flyChips(item) {
    const arena = document.getElementById("arena");
    const target = document.getElementById("seat-" + item.to);

    if (!target) return;

    const source = item.cup
        ? document.getElementById("cup-" + item.cup)
        : document.getElementById("seat-" + item.from);

    if (!source) return;

    const base = arena.getBoundingClientRect();
    const a = source.getBoundingClientRect();
    const b = target.getBoundingClientRect();

    const flier = document.createElement("div");
    flier.className = "flier";
    flier.appendChild(art("chipStack"));

    const label = document.createElement("span");
    label.textContent = "+" + item.amount;
    flier.appendChild(label);

    flier.style.left = (a.left - base.left + a.width / 2 - 24) + "px";
    flier.style.top = (a.top - base.top + a.height / 2 - 10) + "px";

    arena.appendChild(flier);

    const dx = (b.left - a.left) + (b.width - a.width) / 2;
    const dy = (b.top - a.top) + (b.height - a.height) / 2;

    requestAnimationFrame(() => {
        flier.style.transform = "translate(" + dx + "px," + dy + "px) scale(0.7)";
        flier.style.opacity = "0.15";
    });

    setTimeout(() => flier.remove(), 900);
}

function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
}

window.addEventListener("resize", () => { if (state && state.phase !== "lobby") renderSeats(); });

</script>
