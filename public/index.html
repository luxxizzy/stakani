<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#061511">
<title>Tumblers</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M24 22h52l-8 62c-1 6-10 8-18 8s-17-2-18-8z' fill='%23E2AC42'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="app">

    <!-- ШАПКА -->
    <header class="bar">
        <h1 class="wordmark">TUMBLERS</h1>

        <div class="bar-right hidden" id="tableTag">
            <span class="table-code">стол <b id="roomCode"></b></span>
            <button class="chip-button" id="leaveButton">выйти</button>
        </div>
    </header>

    <!-- ВХОД -->
    <section class="sheet" id="entryScreen">
        <div class="panel">
            <p class="lede">Дилер прячет фишки под стаканы. Остальные торгуются за очередь,
                ставят вслепую и вскрывают.</p>

            <div class="field">
                <label for="nameInput">Как тебя зовут</label>
                <input id="nameInput" maxlength="20" placeholder="Имя" autocomplete="nickname">
            </div>

            <button class="wide" id="createButton">Собрать стол</button>

            <div class="split"><span>или войти по коду</span></div>

            <input id="codeInput" class="code-input" maxlength="4" placeholder="····" autocomplete="off">

            <div class="pair">
                <button class="ghost" id="joinButton">Сесть играть</button>
                <button class="ghost" id="watchButton">Смотреть</button>
            </div>
        </div>
    </section>

    <!-- ЛОББИ -->
    <section class="sheet hidden" id="lobbyScreen">
        <div class="panel">
            <h2>Кто за столом</h2>
            <div class="tape" id="lobbyList"></div>

            <p class="lobby-note" id="lobbyStatus"></p>

            <div class="host-controls" id="hostControls">
                <div class="field">
                    <label for="startingChips">Фишек на старте</label>
                    <input id="startingChips" type="number" inputmode="numeric" value="100" min="10">
                </div>
                <button class="wide" id="startButton">Начать партию</button>
            </div>

            <div class="split"><span>позвать людей</span></div>

            <button class="ghost wide" id="copyButton">Скопировать ссылку</button>
        </div>
    </section>

    <!-- СТОЛ -->
    <main class="table-area hidden" id="tableArea">

        <div class="lamp" aria-hidden="true">
            <div class="lamp-cord"></div>
            <div class="lamp-shade"></div>
        </div>

        <div class="beam" aria-hidden="true"></div>
        <div class="gloom" aria-hidden="true"></div>

        <div class="arena" id="arena">
            <div class="felt"></div>

            <div class="crest">
                <div class="crest-line" id="headline"></div>
                <div class="crest-sub" id="subline"></div>
            </div>

            <div class="tumblers" id="cups"></div>
        </div>

        <div class="reaction-tray hidden" id="reactionTray"></div>
        <button class="react-fab" id="reactButton" aria-label="реакции">☺</button>
    </main>

    <!-- ДОК ДЕЙСТВИЙ -->
    <footer class="dock hidden" id="dock">
        <div class="dock-timer" id="dockTimer"><i id="dockTimerBar"></i></div>
        <div class="dock-body" id="dockBody"></div>
    </footer>

</div>

<div class="status" id="status">Подключение…</div>
<div class="build" id="build"></div>

<template id="tumbler">
    <svg viewBox="0 0 90 122" aria-hidden="true">
        <defs>
            <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#2C5B4A"/>
                <stop offset="0.3" stop-color="#417C67"/>
                <stop offset="0.68" stop-color="#255044"/>
                <stop offset="1" stop-color="#1A3B31"/>
            </linearGradient>
            <linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#8A6724"/>
                <stop offset="0.42" stop-color="#F5D089"/>
                <stop offset="1" stop-color="#8A6724"/>
            </linearGradient>
        </defs>

        <path d="M10 16 L20 102 C21 111 33 116 45 116 C57 116 69 111 70 102 L80 16 Z" fill="url(#glassBody)"/>
        <path d="M25 24 L33 100 C33.5 105 36 108 40 109 L31 24 Z" fill="#fff" opacity="0.1"/>
        <path d="M58 24 L52 108 C56 107 58 105 58.5 100 L64 24 Z" fill="#000" opacity="0.12"/>
        <ellipse cx="45" cy="16" rx="35" ry="10" fill="url(#glassRim)"/>
        <ellipse cx="45" cy="16" rx="28" ry="7" fill="#123028"/>
    </svg>
</template>

<template id="tumblerMini">
    <svg viewBox="0 0 90 122" aria-hidden="true">
        <path d="M10 16 L20 102 C21 111 33 116 45 116 C57 116 69 111 70 102 L80 16 Z" fill="#255044"/>
        <ellipse cx="45" cy="16" rx="35" ry="10" fill="#8A6724"/>
        <ellipse cx="45" cy="16" rx="28" ry="7" fill="#123028"/>
    </svg>
</template>

<script src="app.js"></script>

</body>
</html>
