<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Три стадии вскрытия стакана: закрытый, подъём, добыча под ним" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#123028"/>
        <stop offset="100%" stop-color="#071913"/>
    </linearGradient>

    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#2C5B4A"/>
        <stop offset="30%" stop-color="#417C67"/>
        <stop offset="68%" stop-color="#255044"/>
        <stop offset="100%" stop-color="#1A3B31"/>
    </linearGradient>

    <linearGradient id="rim2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#8A6724"/>
        <stop offset="42%" stop-color="#F5D089"/>
        <stop offset="100%" stop-color="#8A6724"/>
    </linearGradient>

    <radialGradient id="shade2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <g id="cup2">
        <path d="M10 16 L20 102 C21 111 33 116 45 116 C57 116 69 111 70 102 L80 16 Z" fill="url(#glass2)"/>
        <path d="M25 24 L33 100 C33.5 105 36 108 40 109 L31 24 Z" fill="#fff" opacity="0.1"/>
        <ellipse cx="45" cy="16" rx="35" ry="10" fill="url(#rim2)"/>
        <ellipse cx="45" cy="16" rx="28" ry="7" fill="#123028"/>
    </g>
</defs>

<rect width="960" height="330" rx="18" fill="url(#bg)"/>

<line x1="320" y1="40" x2="320" y2="290" stroke="#E2AC42" stroke-opacity="0.12"/>
<line x1="640" y1="40" x2="640" y2="290" stroke="#E2AC42" stroke-opacity="0.12"/>

<!-- 1. закрыт -->
<g transform="translate(115 80)">
    <ellipse cx="45" cy="120" rx="34" ry="7" fill="url(#shade2)"/>
    <use href="#cup2"/>
</g>
<text x="160" y="286" font-family="Verdana, sans-serif" font-size="13"
      fill="#7E9C8E" text-anchor="middle">закрыт — видно только номер</text>

<!-- 2. подъём -->
<g transform="translate(435 80)">
    <ellipse cx="52" cy="120" rx="26" ry="6" fill="url(#shade2)"/>
    <g transform="translate(4 -52) rotate(8 45 60)">
        <use href="#cup2"/>
    </g>
</g>
<text x="480" y="286" font-family="Verdana, sans-serif" font-size="13"
      fill="#7E9C8E" text-anchor="middle">взлетает и опрокидывается</text>

<!-- 3. добыча -->
<g transform="translate(755 80)">
    <ellipse cx="70" cy="120" rx="24" ry="6" fill="url(#shade2)"/>
    <g transform="translate(45 104)">
        <ellipse cx="0" cy="16" rx="22" ry="7" fill="#8A6724" stroke="#000" stroke-opacity="0.35"/>
        <ellipse cx="0" cy="11" rx="22" ry="7" fill="#E2AC42" stroke="#000" stroke-opacity="0.35"/>
        <ellipse cx="0" cy="6" rx="22" ry="7" fill="#C08F2E" stroke="#000" stroke-opacity="0.35"/>
        <ellipse cx="0" cy="1" rx="22" ry="7" fill="#F5D089" stroke="#000" stroke-opacity="0.35"/>
    </g>
    <g transform="translate(20 -48) rotate(16 45 60)">
        <use href="#cup2"/>
    </g>
    <text x="45" y="146" font-family="Verdana, sans-serif" font-size="22" font-weight="bold"
          fill="#E2AC42" text-anchor="middle">24</text>
</g>
<text x="800" y="286" font-family="Verdana, sans-serif" font-size="13"
      fill="#7E9C8E" text-anchor="middle">добыча, число набегает от нуля</text>

</svg>
